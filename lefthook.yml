min_version: 2.1.9

pre-commit:
  jobs:
    - name: lint staged files
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

    - name: format staged files
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,scss,md,mdx,yaml,yml,html}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: type check
      run: pnpm type-check

    - name: unused code
      run: pnpm knip

    - name: React Doctor
      run: pnpm run doctor
